<h3>Undo it any time</h3>
<div class="code"><pre>cephalo uninstall claude
cephalo uninstall hermes
npm uninstall -g @nomajorconcerns/cephalo</pre><button class="copy" type="button">Copy</button></div>
<p class="muted">The first two remove only Cephalo's own entries, after taking a backup. The last removes the command. Your rules file stays yours: <code>~/.cephalo/rules.yml</code>.</p>
